[workspace]
resolver = "2"
members = [
    "crates/reprise-core",
    "crates/reprise-runtime",
    "crates/reprise-runtime-protocol",
    "crates/reprise-platform-linux",
    "crates/reprise-gnome",
    "crates/reprise-cli",
    "crates/reprise-mcp",
    "crates/reprise-stems",
]
default-members = ["crates/reprise-gnome"]

[workspace.package]
version = "0.1.1"
authors = ["Marvin Baudach"]
edition = "2021"
# gtk-rs 0.22 and gstreamer-rs 0.25 set the current dependency floor.
rust-version = "1.92"
license = "MIT"

# Stage 3 Task 1: curated pedantic-lint selection, hardened to `warn` here so
# `cargo clippy --all-targets -- -D warnings` (the gate every commit must
# pass) turns them into hard errors. Each one
# targets a real class of mistake this codebase cares about: needless_pass_by_
# value/redundant_closure_for_method_calls (unnecessary clones/indirection),
# semicolon_if_nothing_returned/uninlined_format_args (consistency across a
# codebase with many `tracing!`/`format!` call sites), map_unwrap_or (prefer
# map_or over an unwrap_or after map, which can panic-shaped-read), and
# unnested_or_patterns (readability in match arms). Moved to
# `[workspace.lints]` in Task 6 so the same curated set keeps applying to all
# three crates after the workspace split.
[workspace.lints.clippy]
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
