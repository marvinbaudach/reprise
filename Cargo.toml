[package]
name = "reprise"
version = "0.1.0"
description = "A native GTK4 music player, successor to Rhythmbox"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
walkdir = "2"
lofty = "0.22"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer = "0.25"
gtk4 = { version = "0.11.4", features = ["v4_22"] }
libadwaita = { version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
async-channel = "2.5.0"
fastrand = "2"
# Default features ("async-io" + "blocking-api") are kept: "async-io" is
# zbus's own lightweight internal reactor for the blocking API, not a
# competing app-wide async runtime — the `tokio` feature (the thing Stage 2
# Task 6's "no tokio" constraint actually rules out) is off by default and
# stays off. See src/mpris.rs's module doc comment for the thread model this
# enables (a dedicated OS thread using zbus::blocking, no integration with
# glib's MainContext needed for MPRIS itself).
zbus = "5"

[dev-dependencies]
tempfile = "3"
