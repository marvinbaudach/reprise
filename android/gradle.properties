org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Gradle's default is three hours, which on a developer machine means a daemon
# still sitting on its heap long after the last build. Four of them were found
# here holding ~3.5 GB between them, ten hours old and idle — the cost is not
# CPU but memory pressure, which pushed this host into swap. Thirty minutes is
# still far longer than the gap between two builds in one sitting.
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
kotlin.code.style=official
