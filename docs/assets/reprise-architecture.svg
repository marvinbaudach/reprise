<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title description">
  <title id="title">Reprise architecture: one Rust core, four interfaces</title>
  <desc id="description">GNOME, Android through UniFFI, the command line, and the MCP server share reprise-core. The portable core owns library data, queries, queue, playlists, scanning, and settings. The Linux platform layer implements core contracts with GStreamer, MPRIS, MTP, and Trash. Architecture checks keep GTK, libadwaita, GStreamer, and zbus out of the core. This overview shows the principal boundaries, not every workspace crate.</desc>
  <defs>
    <!-- Brand accents come from data/brand/palette.toml; neutrals mix its plate with black or white. -->
    <linearGradient id="core-tint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4FDBD4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4FDBD4" stop-opacity="0.025"/>
    </linearGradient>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#4FDBD4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="coral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#FF6F5E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .label { font-size: 17px; font-weight: 600; letter-spacing: 1.7px; }
      .surface-name { font-size: 29px; font-weight: 650; letter-spacing: -0.5px; }
      .body { font-size: 21px; fill-opacity: 0.74; }
      .detail { font-size: 19px; fill-opacity: 0.62; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .teal { fill: #4FDBD4; }
      .coral { fill: #FF6F5E; }
      .panel { fill: #33363F; fill-opacity: 0.24; stroke: #33363F; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="880" rx="24" fill="#33363F"/>
  <rect x="1" y="1" width="1198" height="878" rx="23" fill="#000000" fill-opacity="0.82"/>

  <!-- Exact canonical mark, kept as vectors so the graphic is self-contained on GitHub. -->
  <g id="reprise-mark" transform="translate(35 19) scale(0.75)">
    <circle cx="30" cy="39" r="5.5" fill="#FF6F5E"/>
    <circle cx="30" cy="57" r="5.5" fill="#FF6F5E"/>
    <rect x="41" y="20" width="5" height="56" rx="1" fill="#FF6F5E"/>
    <rect x="52" y="20" width="15" height="56" rx="1.5" fill="#4FDBD4"/>
  </g>
  <text x="105" y="65" font-size="26" font-weight="650" letter-spacing="-0.4">Reprise</text>
  <text x="1144" y="62" text-anchor="end" class="label" fill-opacity="0.56">ARCHITECTURE</text>

  <text x="56" y="137" font-size="46" font-weight="650" letter-spacing="-1.4">One core. Four ways in.</text>
  <text x="56" y="179" class="body">Native clients and headless tools share the same domain rules.</text>

  <text x="56" y="219" class="label teal">NATIVE APPS</text>
  <text x="612" y="219" class="label coral">HEADLESS TOOLS</text>

  <g id="interfaces">
    <rect x="56" y="237" width="254" height="133" rx="12" class="panel"/>
    <path d="M76 237H290" stroke="#4FDBD4" stroke-width="2"/>
    <text x="80" y="276" class="surface-name">GNOME</text>
    <text x="80" y="312" class="body">GTK4 · libadwaita</text>
    <text x="80" y="345" class="detail mono">reprise-gnome</text>

    <rect x="334" y="237" width="254" height="133" rx="12" class="panel"/>
    <path d="M354 237H568" stroke="#4FDBD4" stroke-width="2"/>
    <text x="358" y="276" class="surface-name">Android</text>
    <text x="358" y="312" class="body">Kotlin · Compose</text>
    <text x="358" y="345" class="detail">via UniFFI</text>

    <rect x="612" y="237" width="254" height="133" rx="12" class="panel"/>
    <path d="M632 237H846" stroke="#FF6F5E" stroke-width="2"/>
    <text x="636" y="276" class="surface-name">CLI</text>
    <text x="636" y="312" class="body">Command line</text>
    <text x="636" y="345" class="detail mono">reprise-cli</text>

    <rect x="890" y="237" width="254" height="133" rx="12" class="panel"/>
    <path d="M910 237H1124" stroke="#FF6F5E" stroke-width="2"/>
    <text x="914" y="276" class="surface-name">MCP</text>
    <text x="914" y="312" class="body">Agent interface</text>
    <text x="914" y="345" class="detail mono">reprise-mcp</text>
  </g>

  <!-- Shared request/result flow; this is a boundary overview, not a call graph. -->
  <path d="M183 370V389H1017V370M461 370V389M739 370V389" fill="none" stroke="#33363F" stroke-width="2"/>
  <path d="M582 389V429" fill="none" stroke="#4FDBD4" stroke-width="2" marker-end="url(#teal-arrow)"/>
  <path d="M618 434V394" fill="none" stroke="#FF6F5E" stroke-width="2" marker-end="url(#coral-arrow)"/>
  <text x="56" y="414" class="label teal" letter-spacing="1">COMMANDS + QUERIES</text>
  <text x="1144" y="414" text-anchor="end" class="label coral" letter-spacing="1">STATE + RESULTS</text>

  <g id="portable-core">
    <rect x="56" y="440" width="1088" height="198" rx="16" fill="url(#core-tint)" stroke="#4FDBD4" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="84" y="477" class="label teal">DOMAIN AUTHORITY</text>
    <text x="1116" y="477" text-anchor="end" class="detail">Portable Rust</text>
    <text x="84" y="521" class="mono" font-size="36" font-weight="650" letter-spacing="-1">reprise-core</text>
    <path d="M84 543H1116" stroke="#4FDBD4" stroke-opacity="0.2"/>
    <text x="84" y="580" font-size="23" font-weight="600">Library + database</text>
    <text x="84" y="612" class="detail">SQLite queries · metadata</text>
    <text x="454" y="580" font-size="23" font-weight="600">Queue + playlists</text>
    <text x="454" y="612" class="detail">Ordering · listening history</text>
    <text x="820" y="580" font-size="23" font-weight="600">Scanning + settings</text>
    <text x="820" y="612" class="detail">Files · module rules</text>
  </g>

  <path d="M70 691V645" fill="none" stroke="#4FDBD4" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#teal-arrow)"/>
  <text x="96" y="672" class="label teal" letter-spacing="0.6">IMPLEMENTS CORE CONTRACTS</text>

  <g id="linux-integration">
    <rect x="56" y="694" width="610" height="124" rx="12" class="panel"/>
    <text x="84" y="726" class="label coral">LINUX INTEGRATION</text>
    <text x="84" y="762" class="mono" font-size="25" font-weight="600">reprise-platform-linux</text>
    <text x="84" y="794" class="body">GStreamer · MPRIS · MTP · Trash</text>
  </g>

  <g id="core-purity">
    <rect x="690" y="694" width="454" height="124" rx="12" class="panel"/>
    <text x="714" y="726" class="label coral" letter-spacing="0.3">FORBIDDEN IN reprise-core</text>
    <text x="714" y="762" font-size="20" fill-opacity="0.8">GTK · libadwaita · GStreamer · zbus</text>
    <text x="714" y="794" class="detail">Enforced by check-architecture.sh</text>
  </g>

  <text x="56" y="854" font-size="17" fill-opacity="0.5">Principal interfaces and Linux integration · dependency boundaries checked in CI</text>
</svg>
