[package]
name = "reprise-android-ffi"
description = "UniFFI surface over reprise-core for the Android app"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "reprise_android_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
reprise-core = { path = "../reprise-core" }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
# The workspace's diagnostics facade, already used throughout reprise-core.
# The artwork path swallows environmental failures behind an `Option`, so the
# reason has to leave a trail somewhere; this is that somewhere.
tracing = "0.1"
# ...and the trail needs a sink, or `tracing` drops every one of those events.
# Same crate and same features the desktop (`reprise-gnome`), the MCP server
# and `reprise-platform-linux` already install their subscribers with, so the
# `REPRISE_LOG` filter syntax is one thing across every frontend.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
# The `logcat` end of that sink — a `tracing-subscriber` layer over
# `__android_log_write`, which is the piece a host build has no equivalent for.
# Taken as a dependency rather than hand-written: a bridge of our own would be
# an `unsafe` FFI shim with a private ABI assumption, maintained here, to
# reimplement 200 published lines.
tracing-android = "0.2"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
