[package]
name = "reprise-runtime"
description = "Single-owner application runtime: owns playback, the queue, background jobs, device runs and the database writer"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The fake ports, published so downstream crates can drive a real runtime in
# their own tests without audio, a display or media files (Task 3.4 runs the
# MCP server against one). They are always compiled for this crate's own
# tests; the feature only decides whether *other* crates may see them.
fakes = []

[dependencies]
reprise-core = { path = "../reprise-core" }
reprise-runtime-protocol = { path = "../reprise-runtime-protocol" }
# Private adapter seams still name Connection until the core public API moves
# to Db in wave 4b. The runtime itself owns a Db and assembles no SQL of its own.
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
