# The core cross-target check lives in its own workflow so it can carry a
# `paths` filter: it only regresses when the portable engine, the workspace
# manifests, or this workflow itself change. A `paths` filter can only scope a
# whole workflow, not a single job, and ci.yml's shared `on:` block must keep
# running the quality gate on every push and PR — so splitting the job out is
# the change that narrows this job without narrowing anything else.
name: Cross-target

on:
  pull_request:
    paths:
      - crates/reprise-core/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cross-target.yml
  push:
    branches:
      - main
      - dev
    paths:
      - crates/reprise-core/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cross-target.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-target:
    name: Core cross-target check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decision 12 (plan §2.6): prove reprise-core stays portable by
      # type-checking it for a Windows and an Android target on every change —
      # the cheapest moment to catch a Linux-only dependency creeping into the
      # engine. rustup ships on the GitHub-hosted runner; the archlinux
      # quality job uses pacman's rust (no rustup), so this is a separate host.
      - name: Add the cross-compilation Rust targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-linux-android

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cross-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cross-cargo-

      # reprise-core links rusqlite with the `bundled` feature, so even
      # `cargo check` runs libsqlite3-sys's build script and compiles SQLite C
      # for the target. `rustup target add` alone is therefore not enough: the
      # MSVC target needs an MSVC-compatible C compiler, which cargo-xwin
      # provides (it fetches the CRT/SDK on demand); clang + lld back it.
      - name: Install the Windows cross C toolchain (cargo-xwin)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld
          cargo install --locked --version 0.23.0 cargo-xwin

      - name: cargo check reprise-core for x86_64-pc-windows-msvc
        run: cargo xwin check --locked -p reprise-core --target x86_64-pc-windows-msvc

      # The GitHub-hosted runner ships the Android NDK; point the cc crate and
      # the Rust linker at its clang so the bundled SQLite C compiles for the
      # target.
      - name: cargo check reprise-core for aarch64-linux-android
        env:
          ANDROID_API: "21"
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          cargo check --locked -p reprise-core --target aarch64-linux-android
