# The cross-target check lives in its own workflow so it can carry a `paths`
# filter: it only regresses when the portable engine, shared presentation,
# shipped Android FFI boundary, Android sources, or workspace manifests
# change. Splitting it out keeps the cross-target toolchains
# independent from the path-routed host suites in ci.yml.
name: Cross-target

on:
  pull_request:
    paths:
      - crates/reprise-core/**
      - crates/reprise-view/**
      - crates/reprise-android-ffi/**
      - android/**
      - Cargo.toml
      - Cargo.lock
  push:
    branches:
      - main
      - dev
    paths:
      - crates/reprise-core/**
      - crates/reprise-view/**
      - crates/reprise-android-ffi/**
      - android/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite-skip:
    name: Classify external suite reuse
    runs-on: ubuntu-24.04
    outputs:
      suite_skip: ${{ steps.authorization.outputs.suite_skip }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate suite reuse
        id: authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          # The pull request's author, not its latest pusher: the Flatpak sources
          # workflow pushes onto a Dependabot branch as the token's owner, and
          # that must not turn the bump into a PR whose suites are skipped.
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev
          dev_sha=$(git rev-parse --verify origin/dev)
          suite_skip=$(
            .github/scripts/ci-paths.sh --suite-skip \
              "$EVENT_NAME" "$REF_NAME" "$ACTOR" "$REPOSITORY_OWNER" \
              "$HEAD_SHA" "$dev_sha"
          )
          echo "suite_skip=$suite_skip" >> "$GITHUB_OUTPUT"

  cross-target:
    name: Core and Android FFI cross-target check
    needs: suite-skip
    if: needs['suite-skip'].outputs.suite_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decision 12 (plan §2.6): prove reprise-core stays portable and the
      # shipped Android FFI boundary remains Android-buildable by type-checking
      # them for their cross targets on every relevant change. This is the
      # cheapest moment to catch a Linux-only dependency creeping in. rustup
      # ships on the GitHub-hosted runner; the archlinux quality job uses
      # pacman's rust (no rustup), so this is a separate host.
      - name: Add the cross-compilation Rust targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-linux-android

      # Only dev and the nightly run on main write caches: a pull request's
      # entries are scoped to its own ref, so dev could never read them back,
      # while an entry written on the default branch is readable from every branch.
      # The downloads are saved even when the run fails, or a red dev would
      # never warm the cache that would make it green faster, but not when the
      # run is cancelled: a cancelled run holds a partial registry, and saving
      # it under the exact key would make every later run hit it and skip the save.
      - name: Cache Cargo downloads
        id: cargo_downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cross-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cross-cargo-

      - name: Cache cargo-xwin
        id: cargo_xwin_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-0.23.0

      # reprise-core links rusqlite with the `bundled` feature, so even
      # `cargo check` runs libsqlite3-sys's build script and compiles SQLite C
      # for the target. `rustup target add` alone is therefore not enough: the
      # MSVC target needs an MSVC-compatible C compiler, which cargo-xwin
      # provides (it fetches the CRT/SDK on demand); clang + lld back it.
      - name: Install the Windows cross C toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld

      - name: Install cargo-xwin
        if: steps.cargo_xwin_cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.23.0 cargo-xwin

      - name: Save cargo-xwin
        if: >-
          (github.ref == 'refs/heads/dev' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'schedule')) &&
          steps.cargo_xwin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-0.23.0

      - name: cargo check reprise-core for x86_64-pc-windows-msvc
        run: cargo xwin check --locked -p reprise-core --target x86_64-pc-windows-msvc

      # The GitHub-hosted runner ships the Android NDK; point the cc crate and
      # the Rust linker at its clang so the bundled SQLite C compiles for the
      # target.
      - name: cargo check reprise-core and reprise-android-ffi for aarch64-linux-android
        env:
          ANDROID_API: "21"
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          cargo check --locked -p reprise-core --target aarch64-linux-android
          cargo check --locked -p reprise-android-ffi --target aarch64-linux-android

      - name: Save Cargo downloads
        if: >-
          !cancelled() &&
          (github.ref == 'refs/heads/dev' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'schedule')) &&
          steps.cargo_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cross-cargo-${{ hashFiles('Cargo.lock') }}
