name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-suite:
    name: Android JVM unit suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            android-cargo-${{ runner.os }}-

      - name: Run the Android JVM unit suite
        run: scripts/check-android-suite.sh

  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      GDK_BACKEND: x11
      WAYLAND_DISPLAY: ""
      REPRISE_AUDIO_SINK: fakesink
      DISPLAY_TEST_JOBS: 1
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cargo-audit dbus gettext git gstreamer gst-plugins-base
          gst-plugins-good gtk4 libadwaita libsecret mesa
          meson openssh pkgconf
          ripgrep shellcheck rust sqlite xdotool xorg-server-xvfb xorg-xauth

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run the required project gate
        run: scripts/ci-quality.sh
