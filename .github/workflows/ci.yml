name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  # Run every suite nightly so rolling-toolchain lints surface before promotion.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Route changed paths
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.routes.outputs.android }}
      gnome: ${{ steps.routes.outputs.gnome }}
      core: ${{ steps.routes.outputs.core }}
      display: ${{ steps.routes.outputs.display }}
      suite_skip: ${{ steps.routes.outputs.suite_skip }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify affected surfaces
        id: routes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev
          dev_sha=$(git rev-parse --verify origin/dev)
          suite_skip=$(
            .github/scripts/ci-paths.sh --suite-skip \
              "$EVENT_NAME" "$REF_NAME" "$ACTOR" "$REPOSITORY_OWNER" \
              "$HEAD_SHA" "$dev_sha"
          )
          echo "suite_skip=$suite_skip" >> "$GITHUB_OUTPUT"
          if [[ $suite_skip == true ]]; then
            printf 'android=false\ngnome=false\ncore=false\ndisplay=false\n' >> "$GITHUB_OUTPUT"
          else
            .github/scripts/ci-paths.sh --diff \
              "$EVENT_NAME" "$REF_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  base-contracts:
    name: Base and contract checks
    needs: changes
    if: needs.changes.outputs.suite_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install contract dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify maintained desktop version metadata
        run: scripts/check-release-metadata.sh --gate

      - name: Verify Flatpak Cargo sources
        run: scripts/check-flatpak-cargo-sources.sh

      - name: Set up Node Current
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: |
            quality/package-lock.json
            showroom/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"

      - name: Verify worktree hygiene
        run: |
          scripts/tests/worktree-gc.sh
          scripts/tests/worktree-gc-schedule.sh

      - name: Run the script self-tests
        run: scripts/tests/qa-linters.sh

      - name: Verify repository and workflow contracts
        run: |
          scripts/check-architecture.sh
          scripts/check-shell.sh
          scripts/tests/github-flow.sh
          for contract in .github/tests/*.sh; do
            GITHUB_ACTIONS=false "$contract"
          done

      - name: Verify project source quality
        run: scripts/check-project-quality.sh --project --showroom

  android-unit-suite:
    name: Android JVM unit suite
    needs: changes
    if: >-
      needs.changes.outputs.suite_skip != 'true' &&
      needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      # Android runs no GTK display tests; keep the project-wide fallback
      # explicit while the display-tests matrix job overrides it below.
      DISPLAY_TEST_JOBS: 1
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            android-cargo-${{ runner.os }}-

      - name: Test the shared Android Rust crates
        run: cargo test --locked -p reprise-view -p reprise-android-ffi

      # lintDebug resolves the generated UniFFI Kotlin types, so the
      # self-contained JVM suite must generate those bindings first.
      - name: Run the Android JVM unit suite
        run: scripts/check-android-suite.sh

      - name: Run Android source quality
        run: scripts/check-project-quality.sh --android

  gnome-suite:
    name: GNOME quality suite
    needs: changes
    if: >-
      needs.changes.outputs.suite_skip != 'true' &&
      needs.changes.outputs.gnome == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      GDK_BACKEND: x11
      WAYLAND_DISPLAY: ""
      REPRISE_AUDIO_SINK: fakesink
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cargo-audit dbus gettext git gstreamer gst-plugins-base
          gst-plugins-good gtk4 jq libadwaita libsecret mesa
          meson openssh pkgconf
          ripgrep shellcheck rust sqlite xdotool xorg-server-xvfb xorg-xauth

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run the targeted GNOME gate
        run: .github/scripts/check-gnome-ci.sh

  core-suite:
    name: Core and workspace quality suite
    needs: changes
    if: >-
      needs.changes.outputs.suite_skip != 'true' &&
      needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      GDK_BACKEND: x11
      WAYLAND_DISPLAY: ""
      REPRISE_AUDIO_SINK: fakesink
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cargo-audit dbus gettext git gstreamer gst-plugins-base
          gst-plugins-good gtk4 jq libadwaita libsecret mesa
          meson openssh pkgconf
          ripgrep shellcheck rust sqlite xdotool xorg-server-xvfb xorg-xauth

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node Current
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: |
            quality/package-lock.json
            showroom/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run the complete workspace gate
        run: scripts/ci-quality.sh

  display-tests:
    name: Display tests ${{ matrix.shard }}/4
    needs: changes
    if: >-
      needs.changes.outputs.suite_skip != 'true' &&
      needs.changes.outputs.display == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      GDK_BACKEND: x11
      WAYLAND_DISPLAY: ""
      REPRISE_AUDIO_SINK: fakesink
      DISPLAY_TEST_JOBS: 4
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cargo-audit dbus gettext git gstreamer gst-plugins-base
          gst-plugins-good gtk4 jq libadwaita libsecret mesa
          meson openssh pkgconf
          ripgrep shellcheck rust sqlite xdotool xorg-server-xvfb xorg-xauth

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run display-test shard
        run: scripts/check-display-tests.sh --shard ${{ matrix.shard }}/4

  quality:
    name: Quality gate
    needs: [changes, base-contracts, android-unit-suite, gnome-suite, core-suite, display-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7

      - name: Require every selected gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BASE_RESULT: ${{ needs['base-contracts'].result }}
          SUITE_SKIP: ${{ needs.changes.outputs.suite_skip }}
          ANDROID_ROUTE: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs['android-unit-suite'].result }}
          GNOME_ROUTE: ${{ needs.changes.outputs.gnome }}
          GNOME_RESULT: ${{ needs['gnome-suite'].result }}
          CORE_ROUTE: ${{ needs.changes.outputs.core }}
          CORE_RESULT: ${{ needs['core-suite'].result }}
          DISPLAY_ROUTE: ${{ needs.changes.outputs.display }}
          DISPLAY_RESULT: ${{ needs['display-tests'].result }}
        run: >-
          .github/scripts/require-ci-results.sh
          "$CHANGES_RESULT" "$BASE_RESULT"
          "$SUITE_SKIP"
          "$ANDROID_ROUTE" "$ANDROID_RESULT"
          "$GNOME_ROUTE" "$GNOME_RESULT"
          "$CORE_ROUTE" "$CORE_RESULT"
          "$DISPLAY_ROUTE" "$DISPLAY_RESULT"
