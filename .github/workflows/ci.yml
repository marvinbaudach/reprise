name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Route changed paths
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.routes.outputs.android }}
      gnome: ${{ steps.routes.outputs.gnome }}
      core: ${{ steps.routes.outputs.core }}
      owner_skip: ${{ steps.routes.outputs.owner_skip }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify affected surfaces
        id: routes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          commit_message=$(git log -1 --format=%B "$HEAD_SHA")
          owner_skip=$(
            .github/scripts/ci-paths.sh --owner-skip \
              "$EVENT_NAME" "$PR_AUTHOR" "$REPOSITORY_OWNER" "$commit_message"
          )
          echo "owner_skip=$owner_skip" >> "$GITHUB_OUTPUT"
          if [[ $owner_skip == true ]]; then
            printf 'android=false\ngnome=false\ncore=false\n' >> "$GITHUB_OUTPUT"
          else
            .github/scripts/ci-paths.sh --diff \
              "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  base-contracts:
    name: Base and contract checks
    needs: changes
    if: needs.changes.outputs.owner_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install contract dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify repository and workflow contracts
        run: |
          scripts/check-shell.sh
          scripts/tests/github-flow.sh
          for contract in .github/tests/*.sh; do
            GITHUB_ACTIONS=false "$contract"
          done

  android-unit-suite:
    name: Android JVM unit suite
    needs: changes
    if: >-
      needs.changes.outputs.owner_skip != 'true' &&
      needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      # Android runs no GTK display tests; keep the project-wide fallback
      # explicit while the two display-running jobs override it below.
      DISPLAY_TEST_JOBS: 1
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            android-cargo-${{ runner.os }}-

      - name: Test the shared Android Rust crates
        run: cargo test --locked -p reprise-view -p reprise-android-ffi

      - name: Run the Android JVM unit suite
        run: scripts/check-android-suite.sh

  gnome-suite:
    name: GNOME quality suite
    needs: changes
    if: >-
      needs.changes.outputs.owner_skip != 'true' &&
      needs.changes.outputs.gnome == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      GDK_BACKEND: x11
      WAYLAND_DISPLAY: ""
      REPRISE_AUDIO_SINK: fakesink
      DISPLAY_TEST_JOBS: 4
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cargo-audit dbus gettext git gstreamer gst-plugins-base
          gst-plugins-good gtk4 libadwaita libsecret mesa
          meson openssh pkgconf
          ripgrep shellcheck rust sqlite xdotool xorg-server-xvfb xorg-xauth

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run the targeted GNOME gate
        run: .github/scripts/check-gnome-ci.sh

  core-suite:
    name: Core and workspace quality suite
    needs: changes
    if: >-
      needs.changes.outputs.owner_skip != 'true' &&
      needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      GDK_BACKEND: x11
      WAYLAND_DISPLAY: ""
      REPRISE_AUDIO_SINK: fakesink
      DISPLAY_TEST_JOBS: 4
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cargo-audit dbus gettext git gstreamer gst-plugins-base
          gst-plugins-good gtk4 libadwaita libsecret mesa
          meson openssh pkgconf
          ripgrep shellcheck rust sqlite xdotool xorg-server-xvfb xorg-xauth

      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run the complete workspace gate
        run: scripts/ci-quality.sh

  quality:
    name: Quality gate
    needs: [changes, base-contracts, android-unit-suite, gnome-suite, core-suite]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7

      - name: Require every selected gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BASE_RESULT: ${{ needs['base-contracts'].result }}
          OWNER_SKIP: ${{ needs.changes.outputs.owner_skip }}
          ANDROID_ROUTE: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs['android-unit-suite'].result }}
          GNOME_ROUTE: ${{ needs.changes.outputs.gnome }}
          GNOME_RESULT: ${{ needs['gnome-suite'].result }}
          CORE_ROUTE: ${{ needs.changes.outputs.core }}
          CORE_RESULT: ${{ needs['core-suite'].result }}
        run: >-
          .github/scripts/require-ci-results.sh
          "$CHANGES_RESULT" "$BASE_RESULT"
          "$OWNER_SKIP"
          "$ANDROID_ROUTE" "$ANDROID_RESULT"
          "$GNOME_ROUTE" "$GNOME_RESULT"
          "$CORE_ROUTE" "$CORE_RESULT"
