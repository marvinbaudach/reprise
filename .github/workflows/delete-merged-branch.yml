name: Delete merged branch

# Repo-wide "Automatically delete head branches" was switched OFF so that dev
# would survive the dev→main promotion, whose pull request had dev as its head.
# Since 2026-07-28 the repository allows squash merging only, and the promotion
# is a fast-forward push instead of a pull request (see docs/agents/branching.md),
# so no long-lived branch is ever a pull-request head. The setting is therefore
# safe to enable, which would make this workflow redundant; it is kept for now
# because Actions do not currently run for this account and the guard below
# costs nothing.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete head branch (except dev)
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'dev' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting merged branch: $HEAD_REF"
          # Tolerate an already-deleted branch (e.g. manual delete on merge).
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" \
            || echo "Branch $HEAD_REF was already gone; nothing to do."
