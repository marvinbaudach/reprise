name: Delete merged branch

# Repo-wide "Automatically delete head branches" is intentionally OFF so that
# dev survives every dev→main promotion (the promotion PR's head is always dev,
# and GitHub's built-in auto-delete cannot be scoped per branch on a private
# free-tier repo — branch protection and rulesets both require GitHub Pro).
# This workflow reproduces auto-delete for every OTHER merged branch instead.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete head branch (except dev)
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'dev' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting merged branch: $HEAD_REF"
          # Tolerate an already-deleted branch (e.g. manual delete on merge).
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" \
            || echo "Branch $HEAD_REF was already gone; nothing to do."
