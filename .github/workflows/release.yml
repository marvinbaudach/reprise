name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify both artifacts without publishing
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - flatpak/**
      - android/**
      - io.github.marvinbaudach.Reprise.yml
      - meson.build
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - data/*.metainfo.xml
      - scripts/android-build.sh
      - scripts/bump-version.sh
      - scripts/check-release-metadata.sh

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Authorize release build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      tag: ${{ steps.decision.outputs.tag }}
      desktop_version: ${{ steps.decision.outputs.desktop_version }}
      android_version: ${{ steps.decision.outputs.android_version }}
      android_code: ${{ steps.decision.outputs.android_code }}
    steps:
      - name: Check out the promoted revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require curated release metadata
        run: scripts/check-release-metadata.sh

      - name: Wait for the exact Quality gate and check tag absence
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          desktop_version=$(scripts/bump-version.sh current)
          android_version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)
          android_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)$/\1/p' android/app/build.gradle.kts)
          tag="v$desktop_version"
          [[ -n $android_version && -n $android_code ]]

          {
            echo "publish=false"
            echo "tag=$tag"
            echo "desktop_version=$desktop_version"
            echo "android_version=$android_version"
            echo "android_code=$android_code"
          } >> "$GITHUB_OUTPUT"

          deadline=$((SECONDS + 3600))
          status=missing
          conclusion=
          while ((SECONDS < deadline)); do
            set +e
            check=$(
              gh api \
                --method GET \
                -F per_page=100 \
                -H "Accept: application/vnd.github+json" \
                "repos/$REPOSITORY/commits/$REVISION/check-runs" \
                --jq '[.check_runs[] | select(.name == "Quality gate")] | sort_by(.id) | last // {}'
            )
            check_status=$?
            set -e
            if ((check_status != 0)); then
              echo "Quality gate lookup failed; retrying in 20 seconds." >&2
              sleep 20
              continue
            fi
            status=$(jq -r '.status // "missing"' <<< "$check")
            conclusion=$(jq -r '.conclusion // ""' <<< "$check")

            case "$status" in
              queued|in_progress|missing)
                sleep 20
                ;;
              completed)
                break
                ;;
              *)
                echo "Unexpected Quality gate status: $status" >&2
                exit 1
                ;;
            esac
          done

          if [[ $status != completed ]]; then
            echo "Quality gate did not complete within 60 minutes" >&2
            exit 1
          fi

          case "$conclusion" in
            success)
              echo "Quality gate succeeded for $REVISION" >> "$GITHUB_STEP_SUMMARY"
              ;;
            cancelled)
              echo "Release skipped: Quality gate was cancelled because this promotion " \
                "was superseded." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            skipped)
              echo "Release skipped: Quality gate was skipped and is not green." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "Release skipped: Quality gate concluded '$conclusion'." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          set +e
          tag_response=$(gh api -i "repos/$REPOSITORY/git/ref/tags/$tag" 2>&1)
          tag_status=$?
          set -e
          if ((tag_status == 0)); then
            echo "Release skipped: tag $tag already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $tag_response != *"HTTP 404"* ]]; then
            echo "Could not determine whether $tag exists: $tag_response" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          {
            echo "Release build authorized for $REVISION."
            echo ""
            echo "- Desktop: $desktop_version ($tag)"
            echo "- Android: $android_version (code $android_code)"
            echo "- Tag: absent"
          } >> "$GITHUB_STEP_SUMMARY"

  flatpak:
    name: Build Flatpak bundle
    needs: gate
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (needs.gate.result == 'success' && needs.gate.outputs.publish == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flatpak tooling and GNOME 50 SDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder ostree
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --version
          ostree --version
          retry_delays=(20 40 60 120)
          for attempt in 1 2 3 4 5; do
            # A Flathub edge mirror can resolve the ref but miss a static-delta object
            # mid-transfer; fetch ordinary OSTree objects to avoid that 404 class.
            if flatpak --user install --noninteractive --or-update --no-static-deltas flathub \
              org.gnome.Platform//50 \
              org.gnome.Sdk//50 \
              org.freedesktop.Sdk.Extension.rust-stable//25.08; then
              break
            fi
            if ((attempt == 5)); then
              echo "Flatpak runtime installation failed after five attempts." >&2
              verbose_log="$RUNNER_TEMP/flatpak-runtime-install.log"
              flatpak --ostree-verbose -v --user install \
                --noninteractive --or-update --no-static-deltas flathub \
                org.gnome.Platform//50 \
                org.gnome.Sdk//50 \
                org.freedesktop.Sdk.Extension.rust-stable//25.08 \
                > "$verbose_log" 2>&1 || true

              # Nothing in this best-effort diagnosis may replace the original failure.
              set +e
              started_objects="$RUNNER_TEMP/flatpak-started-objects.txt"
              completed_objects="$RUNNER_TEMP/flatpak-completed-objects.txt"
              sed -nE \
                's/.*starting fetch of ([[:xdigit:]]{64}\.[[:alnum:]_-]+).*/\1/p' \
                "$verbose_log" | sort -u > "$started_objects" || true
              sed -nE \
                's/.*fetch of ([[:xdigit:]]{64}\.[[:alnum:]_-]+) complete.*/\1/p' \
                "$verbose_log" | sort -u > "$completed_objects" || true
              mapfile -t incomplete_objects < <(
                comm -23 "$started_objects" "$completed_objects" || true
              )

              report_diagnosis() {
                printf '%s\n' "$1" >&2 || true
                printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY" || true
              }
              probe_object_url() {
                local url=$1 status
                status=$(curl --silent --show-error --location --head --output /dev/null \
                  --write-out '%{http_code}' "$url" 2>/dev/null) || status=000
                [[ $status =~ ^[0-9]{3}$ ]] || status=000
                printf '%s' "$status"
              }

              report_diagnosis "### Flatpak runtime install diagnosis"
              report_diagnosis ""
              report_diagnosis \
                "Verbose evidence is stored in the flatpak-runtime-install-log artifact."
              missing_objects=()
              missing_urls=()
              missing_statuses=()
              for object in "${incomplete_objects[@]}"; do
                object_hash=${object%%.*}
                object_extension=${object#*.}
                probe_extensions=("$object_extension")
                # archive-z2 objects are served as .filez even though the verbose
                # OSTree log spells them .file, so both extensions are worth probing.
                # Commit objects use their logged .commit extension.
                if [[ $object_extension == file ]]; then
                  probe_extensions+=(filez)
                fi

                actual_url=
                actual_status=000
                for extension in "${probe_extensions[@]}"; do
                  url="https://dl.flathub.org/repo/objects/${object_hash:0:2}/${object_hash:2}.$extension"
                  status=$(probe_object_url "$url")
                  report_diagnosis "- Object $object: $url -> HTTP $status"
                  actual_url=$url
                  actual_status=$status
                done
                if [[ $actual_status == 404 ]]; then
                  missing_objects+=("$object")
                  missing_urls+=("$actual_url")
                  missing_statuses+=("$actual_status")
                fi
              done

              runtime_ref=org.freedesktop.Sdk.Extension.rust-stable//25.08
              runtime_commit=$(flatpak --user remote-info --show-commit \
                flathub "$runtime_ref" 2>/dev/null || true)
              commit_url=
              commit_status=000
              if [[ $runtime_commit =~ ^[[:xdigit:]]{64}$ ]]; then
                commit_url="https://dl.flathub.org/repo/objects/${runtime_commit:0:2}/${runtime_commit:2}.commit"
                commit_status=$(probe_object_url "$commit_url")
                report_diagnosis \
                  "- Ref commit $runtime_commit.commit: $commit_url -> HTTP $commit_status"
              else
                report_diagnosis \
                  "- Ref commit probe unavailable: remote-info did not return a commit hash."
              fi

              if ((${#missing_objects[@]} == 0)); then
                report_diagnosis \
                  "Verdict: no started-but-incomplete object returned HTTP 404."
              elif [[ $commit_status == 200 ]]; then
                for index in "${!missing_objects[@]}"; do
                  printf -v verdict '%s' \
                    "Verdict: object ${missing_objects[index]} is unavailable at " \
                    "${missing_urls[index]} (HTTP ${missing_statuses[index]}), " \
                    "while ref commit $runtime_commit.commit is served at $commit_url " \
                    "(HTTP $commit_status). " \
                    "This is an incomplete publish on the Flathub side, " \
                    "not a fault of this workflow or this runner; the job should simply " \
                    "be re-run once Flathub republishes the ref."
                  report_diagnosis "$verdict"
                done
              else
                for index in "${!missing_objects[@]}"; do
                  printf -v verdict '%s' \
                    "Verdict: object ${missing_objects[index]} is unavailable at " \
                    "${missing_urls[index]} (HTTP ${missing_statuses[index]}); the ref " \
                    "commit probe returned HTTP $commit_status, so an incomplete " \
                    "publish could not be confirmed."
                  report_diagnosis "$verdict"
                done
              fi
              exit 1
            fi
            delay=${retry_delays[attempt - 1]}
            echo "Flatpak runtime installation attempt $attempt failed; retrying in $delay seconds." >&2
            sleep "$delay"
          done

      - name: Upload Flatpak runtime install log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-runtime-install-log
          path: ${{ runner.temp }}/flatpak-runtime-install.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Reclaim disk for the Flatpak build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          {
            echo "### Flatpak disk headroom"
            echo ""
            echo "**After runner cleanup (Flatpak build baseline)**"
            echo '```text'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Flatpak repository
        env:
          REPRISE_LASTFM_API_KEY: ${{ secrets.REPRISE_LASTFM_API_KEY }}
          REPRISE_LASTFM_SHARED_SECRET: ${{ secrets.REPRISE_LASTFM_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # `option_env!` reads these at compile time, so they must be in the
          # environment of the cargo run itself — which happens inside
          # flatpak-builder's sandbox. flatpak-builder has no `--env`, so this
          # job's environment cannot reach it; the manifest is the only
          # channel. Patch the checked-out copy, never the committed one, and
          # keep shell tracing off around it.
          python3 scripts/inject-build-credentials.py io.github.marvinbaudach.Reprise.yml
          flatpak-builder --repo=repo --force-clean build-dir io.github.marvinbaudach.Reprise.yml
          {
            echo ""
            echo "**After flatpak-builder (repository build complete)**"
            echo '```text'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the single-file bundle
        id: bundle
        env:
          EXPECTED_DESKTOP_VERSION: ${{ needs.gate.outputs.desktop_version }}
        run: |
          set -euo pipefail
          version=$(scripts/bump-version.sh current)
          expected=$EXPECTED_DESKTOP_VERSION
          if [[ -n $expected && $version != "$expected" ]]; then
            echo "Cargo.toml desktop version $version differs from gate output $expected" >&2
            exit 1
          fi
          bundle="Reprise-$version.flatpak"
          flatpak build-bundle repo "$bundle" io.github.marvinbaudach.Reprise
          {
            echo ""
            echo "**After flatpak build-bundle (single-file bundle complete)**"
            echo '```text'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$bundle" > "$bundle.sha256"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built $bundle ($(stat -c %s "$bundle") bytes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: reprise-flatpak-${{ steps.bundle.outputs.version }}
          path: |
            ${{ steps.bundle.outputs.bundle }}
            ${{ steps.bundle.outputs.bundle }}.sha256
          if-no-files-found: error
          retention-days: 14

  apk:
    name: Build universal Android APK
    needs: gate
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (needs.gate.result == 'success' && needs.gate.outputs.publish == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-android-cargo-

      - name: Build both native ABIs and generate bindings
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?}"
          ANDROID_TARGET=aarch64-linux-android ANDROID_ABI=arm64-v8a ANDROID_API=26 scripts/android-build.sh
          ANDROID_TARGET=x86_64-linux-android ANDROID_ABI=x86_64 ANDROID_API=26 scripts/android-build.sh

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          require_signing=1
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            require_signing=0
          fi
          echo "require=$require_signing" >> "$GITHUB_OUTPUT"

          if [[ $GITHUB_EVENT_NAME == pull_request || -z $KEYSTORE_BASE64 || \
            -z $KEYSTORE_PASSWORD || -z $KEY_ALIAS || -z $KEY_PASSWORD ]]; then
            if ((require_signing == 1)); then
              echo "Release signing requires ANDROID_KEYSTORE_BASE64, " \
                "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD" >&2
              exit 1
            fi
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Pull-request builds never use the production upload key; this APK uses " \
              "the local debug-signing fallback." >> "$GITHUB_STEP_SUMMARY"
          else
            keystore="$RUNNER_TEMP/reprise-upload.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "REPRISE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo "REPRISE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "REPRISE_KEYSTORE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "REPRISE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "production=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the minified release APK
        env:
          REPRISE_REQUIRE_RELEASE_SIGNING: ${{ steps.signing.outputs.require }}
        run: android/gradlew -p android --no-daemon :app:assembleRelease

      - name: Verify signature, certificate, and versions
        id: package
        env:
          PRODUCTION_SIGNING: ${{ steps.signing.outputs.production }}
          GATE_ANDROID_VERSION: ${{ needs.gate.outputs.android_version }}
          GATE_ANDROID_CODE: ${{ needs.gate.outputs.android_code }}
        run: |
          set -euo pipefail
          source_apk=android/app/build/outputs/apk/release/app-release.apk
          [[ -s $source_apk ]]

          build_tools=$(
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
              sort -V |
              tail -1
          )
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          aapt2="$ANDROID_HOME/build-tools/$build_tools/aapt2"
          signature=$($apksigner verify --print-certs "$source_apk")
          printf '%s\n' "$signature"

          if [[ $PRODUCTION_SIGNING == true ]]; then
            fingerprint_file=android/signing/upload-key-sha256.txt
            expected=$(grep -E '^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}$' "$fingerprint_file" || true)
            if [[ -z $expected ]]; then
              echo "android/signing/upload-key-sha256.txt still contains its placeholder; " \
                "add the upload certificate SHA-256" >&2
              exit 1
            fi
            # apksigner prints "Signer #1 certificate ..." only for a v1/JAR
            # signature. minSdk 26 turns v1 off, so a correctly signed APK
            # carries "V2 Signer: ..." and "V3 Signer: ..." lines instead and
            # that pattern matched nothing at all. Accept every signer line, and
            # treat "parsed nothing" as its own failure rather than letting an
            # empty string lose the comparison and read as a key mismatch.
            mapfile -t actual < <(
              sed -n 's/^\(Signer #[0-9]* \|V[0-9]* Signer: \)certificate SHA-256 digest: //p' \
                <<< "$signature" | tr 'A-F' 'a-f' | sort -u
            )
            if (( ${#actual[@]} == 0 )); then
              echo "Could not read any certificate SHA-256 from apksigner output" >&2
              exit 1
            fi
            if (( ${#actual[@]} > 1 )); then
              echo "APK carries more than one signer certificate: ${actual[*]}" >&2
              exit 1
            fi
            expected=${expected//:/}
            if [[ ${actual[0]} != ${expected,,} ]]; then
              echo "APK certificate SHA-256 does not match android/signing/upload-key-sha256.txt" >&2
              echo "  expected ${expected,,}" >&2
              echo "  actual   ${actual[0]}" >&2
              exit 1
            fi
          fi

          badging=$($aapt2 dump badging "$source_apk")
          printf '%s\n' "$badging"
          gradle_version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)
          gradle_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)$/\1/p' android/app/build.gradle.kts)
          [[ -z $GATE_ANDROID_VERSION || $gradle_version == "$GATE_ANDROID_VERSION" ]]
          [[ -z $GATE_ANDROID_CODE || $gradle_code == "$GATE_ANDROID_CODE" ]]
          [[ $badging == *"versionCode='$gradle_code'"* ]]
          [[ $badging == *"versionName='$gradle_version'"* ]]

          apk="Reprise-Android-$gradle_version.apk"
          cp "$source_apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version=$gradle_version" >> "$GITHUB_OUTPUT"
          printf 'Built %s (%s bytes), versionCode %s.\n' \
            "$apk" "$(stat -c %s "$apk")" "$gradle_code" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: reprise-apk-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove decoded upload keystore
        if: always()
        run: |
          if [[ -n ${REPRISE_KEYSTORE_PATH:-} && -f $REPRISE_KEYSTORE_PATH ]]; then
            shred -u "$REPRISE_KEYSTORE_PATH" 2>/dev/null || rm -f "$REPRISE_KEYSTORE_PATH"
          fi

  publish:
    name: Publish both release assets
    needs: [gate, flatpak, apk]
    if: >-
      github.event_name != 'pull_request' &&
      needs.gate.outputs.publish == 'true' &&
      needs.flatpak.result == 'success' &&
      needs.apk.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.gate.outputs.tag }}
      DESKTOP_VERSION: ${{ needs.gate.outputs.desktop_version }}
      ANDROID_VERSION: ${{ needs.gate.outputs.android_version }}
      ANDROID_CODE: ${{ needs.gate.outputs.android_code }}
    steps:
      - name: Check out release text
        uses: actions/checkout@v7

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v8
        with:
          name: reprise-flatpak-${{ needs.gate.outputs.desktop_version }}
          path: dist

      - name: Download universal APK
        uses: actions/download-artifact@v8
        with:
          name: reprise-apk-${{ needs.gate.outputs.android_version }}
          path: dist

      - name: Generate release notes
        run: |
          python3 - "$DESKTOP_VERSION" "$ANDROID_VERSION" "$ANDROID_CODE" > release-notes.md <<'PY'
          import pathlib
          import sys

          desktop, android, android_code = sys.argv[1:4]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{desktop}] - "
          start = next(
              (index for index, line in enumerate(changelog.splitlines()) if line.startswith(heading)),
              None,
          )
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {desktop}")
          lines = changelog.splitlines()
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          body = "\n".join(lines[start + 1:end]).strip()

          print(f"# Reprise {desktop}")
          print()
          print(f"Desktop version: **{desktop}**. Android version: **{android}** (code {android_code}).")
          print()
          print("Install the GNOME 50 runtime and Flatpak bundle:")
          print()
          print("```sh")
          print("flatpak install --user flathub org.gnome.Platform//50")
          print(f"flatpak install --user ./Reprise-{desktop}.flatpak")
          print("```")
          print()
          print(
              "The bundle does not self-update. A self-hosted Flatpak repository is "
              "the named follow-up."
          )
          print(
              "This Flatpak ships without stems separation because it does not include "
              "onnxruntime; AUR, COPR and local builds retain the feature."
          )
          print(
              "The Android app requires Android 8.0 or newer and is "
              "GPL-3.0-or-later like the rest of Reprise. Its release APK is "
              f"`Reprise-Android-{android}.apk`."
          )
          print()
          print(body)
          PY

      - name: Create draft release with all assets
        run: |
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Reprise $DESKTOP_VERSION" \
            --notes-file release-notes.md \
            dist/*.flatpak dist/*.flatpak.sha256 dist/*.apk dist/*.apk.sha256

      - name: Verify every draft asset is present and non-empty
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" --json assets,isDraft)
          [[ $(jq -r '.isDraft' <<< "$release") == true ]]
          for asset in \
            "Reprise-$DESKTOP_VERSION.flatpak" \
            "Reprise-$DESKTOP_VERSION.flatpak.sha256" \
            "Reprise-Android-$ANDROID_VERSION.apk" \
            "Reprise-Android-$ANDROID_VERSION.apk.sha256"
          do
            size=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .size' <<< "$release")
            [[ $size =~ ^[1-9][0-9]*$ ]] || {
              echo "Draft asset $asset is missing or empty" >&2
              exit 1
            }
          done

      - name: Publish verified release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Remove stale draft and any draft-created tag
        if: failure()
        run: gh release delete "$TAG" --yes --cleanup-tag || true
