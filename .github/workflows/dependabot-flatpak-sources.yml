name: Dependabot Flatpak sources

# A Dependabot Cargo bump changes Cargo.lock without touching
# flatpak/cargo-sources.json, so the sources are stale on arrival and "Verify
# Flatpak Cargo sources" fails on it. This regenerates the file and pushes it onto the bump's
# own branch.
#
# The push has to use REPRISE_AUTOMERGE_TOKEN: a push made with the Actions
# token starts no new workflow run, so CI would never see the fixed sources.
# That token is a Dependabot secret, which is exactly what a pull_request run
# triggered by Dependabot can read.
#
# The work is split in two jobs because a job is the isolation boundary:
# everything in one job shares a workspace, a .git directory and the
# GITHUB_PATH/GITHUB_ENV files, so code that runs before a token is used could
# plant a git hook or a PATH entry that takes the token.
#
# - `regenerate` holds no secret. It runs the generator, which pulls its
#   Python dependencies from PyPI, from outside the checkout and with uv's
#   config discovery off, and hands over one file as an artifact.
# - `push` holds the token, runs no uv and uses no action at all. It checks
#   the artifact's content against Cargo.lock, copies the one validated
#   artifact over the sources file, insists that nothing else changed, and
#   pushes.
#
# Residual risks, accepted: under `pull_request` this workflow file is
# controlled by the pull request, so a grouped bump that edits the file itself
# runs its edited version; and the checked-out scripts come from the bump's
# branch. Only Dependabot authors those branches.
#
# After the bot's commit Dependabot treats the pull request as edited and stops
# rebasing it. A conflicting or stale bump is recovered with
# `@dependabot recreate`, which rebuilds the branch and re-triggers this
# regeneration.
on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: dependabot-flatpak-sources-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate Flatpak Cargo sources
    # The pull request's author, not github.actor: after the first push the
    # event's actor is the token's owner, and the run must still do its work.
    if: >-
      github.repository == 'marvinbaudach/reprise' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.regenerate.outputs.changed }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out the bump's branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      # The push job checks out exactly this commit. If Dependabot moves the
      # branch in between, the push is rejected instead of grafting sources
      # built from the old lock file onto the new tip.
      - name: Record the commit the sources are built from
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      # flatpak/flatpak-builder-tools master as of 2026-10-05.
      - name: Fetch the pinned generator
        env:
          GENERATOR_COMMIT: 74697c75b630d7330e77250fc13cb5ea688d9479
          GENERATOR_SHA256: 0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380
        run: |
          generator="$RUNNER_TEMP/flatpak-cargo-generator.py"
          curl --fail --silent --show-error --location \
            --output "$generator" \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/$GENERATOR_COMMIT/cargo/flatpak-cargo-generator.py"
          echo "$GENERATOR_SHA256  $generator" | sha256sum --check --strict

      # Run from the temp directory with config discovery off, so no uv.toml or
      # pyproject.toml from the pull request steers uv. The generator's own
      # dependencies are unpinned ranges, so resolution is frozen at a fixed
      # date: a PyPI release published later cannot change what this run
      # executes. Moving the date is a reviewed change to this file.
      - name: Regenerate flatpak/cargo-sources.json
        id: regenerate
        run: |
          mkdir "$RUNNER_TEMP/regenerated"
          cd "$RUNNER_TEMP" || exit 1
          uv run --no-config --exclude-newer 2026-10-05T00:00:00Z \
            --script "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            "$GITHUB_WORKSPACE/Cargo.lock" \
            -o "$RUNNER_TEMP/regenerated/cargo-sources.json"
          if cmp --silent "$RUNNER_TEMP/regenerated/cargo-sources.json" \
            "$GITHUB_WORKSPACE/flatpak/cargo-sources.json"; then
            echo "flatpak/cargo-sources.json already matches Cargo.lock"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand over the regenerated sources
        if: steps.regenerate.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: ${{ runner.temp }}/regenerated/cargo-sources.json
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push the regenerated sources
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Least privilege for the one step that reads the artifact; everything else
    # in the job needs only the contents the top level grants.
    permissions:
      actions: read
      contents: read
    steps:
      # No `uses:` in this job. A grouped Dependabot pull request can bump the
      # action tags in this very file, and a bumped action would run here
      # before the token step. The code comes from plain git, the artifact from
      # the preinstalled gh.
      - name: Check out the commit the sources were built from
        env:
          SHA: ${{ needs.regenerate.outputs.sha }}
        run: |
          git init --quiet .
          git fetch --quiet --depth=1 "https://github.com/${GITHUB_REPOSITORY}" "$SHA"
          git checkout --quiet --detach FETCH_HEAD
          if [[ $(git rev-parse HEAD) != "$SHA" ]]; then
            echo "checked out $(git rev-parse HEAD), not the recorded $SHA" >&2
            exit 1
          fi

      - name: Fetch the regenerated sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name cargo-sources \
            --dir "$RUNNER_TEMP/regenerated"
          # Exactly one regular file, not a symlink, with the expected name:
          # %y reports a symlink as `l` instead of following it.
          listing=$(find "$RUNNER_TEMP/regenerated" -mindepth 1 -printf '%y %P\n')
          if [[ $listing != 'f cargo-sources.json' ]]; then
            printf 'expected the artifact to hold only cargo-sources.json, got:\n%s\n' \
              "$listing" >&2
            exit 1
          fi

      # The artifact comes from a job that ran code from PyPI, so its content
      # is checked against Cargo.lock before it is committed: a valid JSON file
      # is not enough, because the Flatpak release build consumes it with
      # secrets. This runs before, and apart from, the step that holds the token.
      - name: Validate the regenerated sources against Cargo.lock
        run: scripts/check-flatpak-cargo-sources.sh Cargo.lock "$RUNNER_TEMP/regenerated/cargo-sources.json"

      - name: Replace the sources and push them to the bump's branch
        env:
          PUSH_TOKEN: ${{ secrets.REPRISE_AUTOMERGE_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -z $PUSH_TOKEN ]]; then
            echo "REPRISE_AUTOMERGE_TOKEN is not available to this run" >&2
            exit 1
          fi
          regenerated="$RUNNER_TEMP/regenerated/cargo-sources.json"
          cp "$regenerated" flatpak/cargo-sources.json
          changes=$(git status --porcelain)
          if [[ $changes != ' M flatpak/cargo-sources.json' ]]; then
            printf 'expected only flatpak/cargo-sources.json to change, got:\n%s\n' \
              "$changes" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flatpak/cargo-sources.json
          git -c core.hooksPath=/dev/null commit --message 'The Flatpak Cargo sources follow Cargo.lock'
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
