name: Dependabot auto-merge

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    name: Enable Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.repository == 'marvinbaudach/reprise'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Merge after required checks pass
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.REPRISE_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
