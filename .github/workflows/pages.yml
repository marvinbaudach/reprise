name: Showroom

# Builds the showroom and publishes it to GitHub Pages.
#
# Pages currently serves README.md straight from the main branch. Switching the
# Pages source to "GitHub Actions" hands that job to this workflow — until that
# switch is flipped in the repository settings, this workflow builds and proves
# the site but publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - 'showroom/**'
  pull_request:
    paths:
      - 'showroom/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-pages
  cancel-in-progress: true

jobs:
  owner-skip:
    name: Check for repository-owner skip
    runs-on: ubuntu-latest
    outputs:
      owner_skip: ${{ steps.authorization.outputs.owner_skip }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate an explicit owner skip
        id: authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          commit_message=$(git log -1 --format=%B "$HEAD_SHA")
          owner_skip=$(
            .github/scripts/ci-paths.sh --owner-skip \
              "$EVENT_NAME" "$PR_AUTHOR" "$REPOSITORY_OWNER" "$commit_message"
          )
          echo "owner_skip=$owner_skip" >> "$GITHUB_OUTPUT"

  build:
    needs: owner-skip
    if: needs['owner-skip'].outputs.owner_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showroom/package-lock.json

      - name: Install
        working-directory: showroom
        run: npm ci

      - name: Typecheck
        working-directory: showroom
        run: npm run typecheck

      # This builds, prerenders, checks every public page contract, and verifies
      # that all referenced product media ships in the Pages artifact.
      - name: Test build and prerender
        working-directory: showroom
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: showroom/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
