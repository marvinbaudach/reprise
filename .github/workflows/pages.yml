name: Showroom

# Builds the showroom and publishes it to GitHub Pages.
#
# Pages currently serves README.md straight from the main branch. Switching the
# Pages source to "GitHub Actions" hands that job to this workflow — until that
# switch is flipped in the repository settings, this workflow builds and proves
# the site but publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - 'showroom/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # `permalinks-resolve.test.mjs` answers "does this path exist at the
          # commit the page pins?" from the local object database. The pin is an
          # older commit, so a depth-1 checkout does not carry it and every
          # permalink reads as a 404. The rest of CI already checks out in full.
          fetch-depth: 0

      - name: Verify Pages action versions
        run: .github/tests/pages-action-versions.sh

      - uses: actions/setup-node@v7.0.0
        with:
          # Track the newest Node Current release with a complete version pin.
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: showroom/package-lock.json

      - name: Install
        working-directory: showroom
        run: npm ci

      - name: Lint
        working-directory: showroom
        run: npm run lint

      - name: Typecheck
        working-directory: showroom
        run: npm run typecheck

      # This builds, prerenders, checks every public page contract, and verifies
      # that all referenced product media ships in the Pages artifact.
      - name: Test build and prerender
        working-directory: showroom
        run: npm test

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: showroom/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
