version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"

  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"

  - package-ecosystem: gradle
    directory: /android
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"

  - package-ecosystem: npm
    directory: /showroom
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
