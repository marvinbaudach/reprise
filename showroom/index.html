<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reprise — two native apps on one Rust core</title>
    <meta
      name="description"
      content="A GNOME desktop app and an Android app on one shared Rust core, built with AI agents. What gets merged is decided by %GATE_COUNT% gates, not by the agent."
    />
    <meta property="og:title" content="Reprise — two native apps on one Rust core" />
    <meta
      property="og:description"
      content="Native GNOME and Android music apps, one shared Rust core, and an agent workflow governed by evidence."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marvinbaudach.github.io/reprise/" />
    <meta
      property="og:image"
      content="https://marvinbaudach.github.io/reprise/media/showroom/gnome-library.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="dark" />
    <!-- The mark already lives under public/brand; without this link the
         browser asks for /favicon.ico on every load and gets a 404. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/favicon.svg" />
    <!-- The faces are served from this origin (see src/styles/fonts.css). The
         preload starts them with the document instead of after the stylesheet
         that declares them, which is what kept the hero shifting. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/brand/fonts/archivo-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/brand/fonts/martian-mono-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
