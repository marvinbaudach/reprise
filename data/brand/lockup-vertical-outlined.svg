<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848.39 579.60" width="848.39" height="579.60">
  <!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
  <g id="rp-lv-o-mark" transform="translate(210.8607 -62.6667) scale(26.666667)">
  <!-- Die Marke. Eine einzige Zeichnung für jede Größe — kein Stufenbau
       mehr aus voll, reduziert und micro.

       Sie ist auf dem **16er Raster** gezeichnet, und jede tragende Kante
       liegt auf einer ganzen oder halben Rasterlinie. Damit sind 32, 48,
       64, 128 und 512 px glatte Vielfache: die Zeichnung wird vergrößert,
       nicht interpoliert.

       Flach gefüllt, ohne Verlauf. Die Tiefe kommt von der Platte darunter.
       Ein Verlauf in der Marke hätte zwei Kosten: Androids VectorDrawable
       kennt keine Verlaufsverweise, und bei 16 px ist ein Verlauf über drei
       Pixel ohnehin nur Matsch.

       Keine Kopfhörer. Gemessen war das nicht zu retten: in der vollen
       Komposition blieb der Kopf bei einem 48-px-Icon 19 px breit und jedes
       Auge 2 px.

       Die Augen sind das Eulensignal und tragen es doppelt — als Fläche in
       der Farbfassung und als Ring in `mark-mono.svg`. Ein Auge, das
       einfarbig nur ein Loch ist, liest als Katzenauge; erst die Pupille
       darin macht es zum Auge. -->
