<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     fill="currentColor">
  <!-- Einfarbige Fassung: GNOME-Symbolic und Androids Themed Icon. Beide
       werden zur Laufzeit umgefärbt, dort zählt nur Alpha.

       Genau **ein** Pfad, wie das Symbolic es verlangt, und `evenodd` statt
       Wickelrichtungen: die Augen sind Ringe, also Loch mit Pupille darin.
       Wären sie bloße Löcher, läse die Silhouette als Katze — das ist der
       Unterschied, an dem die vorige Fassung gescheitert ist.

       Der Umriss ist identisch mit dem von `mark.svg`. Das Gate misst die
       Deckung beider Umrisse (V8): sonst zeigt derselbe Launcher je nach
       Einstellung zwei verschiedene Eulen. -->
  <path fill-rule="evenodd"
        d="M 8 4 C 9.6 4 11 4.2 12.2 4.6
           C 13.1 3.8 14.3 3.2 15.7 2.5
           C 14.8 4 14.3 5.1 14.1 6.3
           C 15 7.3 15.4 8.4 15.4 9.5
           C 15.4 12.4 12.4 14.5 8 14.5
           C 3.6 14.5 0.6 12.4 0.6 9.5
           C 0.6 8.4 1 7.3 1.9 6.3
           C 1.7 5.1 1.2 4 0.3 2.5
           C 1.7 3.2 2.9 3.8 3.8 4.6
           C 5 4.2 6.4 4 8 4 Z
           M 3 9 A 2 2 0 1 0 7 9 A 2 2 0 1 0 3 9 Z
           M 4 9 A 1 1 0 1 0 6 9 A 1 1 0 1 0 4 9 Z
           M 9 9 A 2 2 0 1 0 13 9 A 2 2 0 1 0 9 9 Z
           M 10 9 A 1 1 0 1 0 12 9 A 1 1 0 1 0 10 9 Z
           M 7 11 L 9 11 L 8 14.5 Z"/>
</svg>
