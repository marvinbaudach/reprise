<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1247 1000" width="1247" height="1000"
     fill="currentColor">
  <!-- Einfarbige Fassung der vollen Zeichnung, für Kontexte, die nur eine
       Farbe hergeben.

       Sie ist **nicht** die eingefärbte Vollfassung: dort liegen Gesicht,
       Augen und Schnabel als eigene Flächen übereinander, und einfarbig
       verschmelzen sie zu einem Klumpen mit zwei Pünktchen. Hier trägt
       stattdessen die Silhouette, und Augen wie Schnabel sind echte
       Aussparungen.

       Die Ringe der Ohrmuscheln entfallen: einfarbig ist ein Ring ein Loch,
       und drei ineinandergelegte Löcher lesen als Zielscheibe. -->
  <path id="mono-band"
        d="M 74 674 C 74 258 314 0 623 0 C 932 0 1173 258 1173 674
           L 1065 674 C 1065 326 872 145 623 145 C 374 145 182 326 182 674 Z"/>
  <ellipse id="mono-cup-l" cx="118" cy="674" rx="118" ry="190"/>
  <ellipse id="mono-cup-r" cx="1129" cy="674" rx="118" ry="190"/>
  <path id="mono-tuft-l" d="M 261 392 C 363 404 457 442 530 496
                          C 460 520 403 560 363 610 C 344 520 308 444 261 392 Z"/>
  <path id="mono-tuft-r" d="M 985 392 C 883 404 789 442 716 496
                          C 786 520 843 560 883 610 C 902 520 938 444 985 392 Z"/>
  <path id="mono-head" fill-rule="evenodd"
        d="M 623 372 C 800 372 950 520 985 700
           C 1006 810 900 999 623 999 C 346 999 240 810 261 700
           C 296 520 446 372 623 372 Z
           M 474 665 A 68 68 0 1 0 474 801 A 68 68 0 1 0 474 665 Z
           M 772 665 A 68 68 0 1 0 772 801 A 68 68 0 1 0 772 665 Z
           M 623 780 C 656 780 683 807 683 840
           C 683 884 656 936 623 980
           C 590 936 563 884 563 840
           C 563 807 590 780 623 780 Z"/>
</svg>
