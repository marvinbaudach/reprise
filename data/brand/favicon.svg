<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
  <!-- Grundfläche des App-Icons. Sie ist hell, weil die Marke dunkel ist:
       Bügel und Kopf sind beide tiefes Violett, also muss der Grund den
       Kontrast liefern. Eine dunkle Platte ließ den Kopf bei 1,23:1
       verschwinden — der Grund, warum die großen Stufen matschig wirkten. -->
  <g id="rp-plate">
    <defs>
      <linearGradient id="rp-plate-fill" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#5798BD"/>
        <stop offset="1" stop-color="#8570CB"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="128" height="128" rx="22" fill="url(#rp-plate-fill)"/>
  </g>
  <g id="rp-mark" transform="translate(23.0820 21.8033) scale(5.114754)">
  <!-- Stufe für 24 und 32 px, zugleich die Vorlage des Symbolic. Ein Pfad,
       keine Kopfhörer: bei dieser Größe wäre der Bügel eine 1-px-Linie, die
       am Kopf klebt.

       Die Silhouette ist dieselbe wie in `mark-reduced.svg` — eiförmiger
       Kopf, dessen obere Ecken in gefegte Federspitzen auslaufen. Sie ist
       hier als **eine durchgehende Kontur** gezeichnet, nicht als Kopf plus
       zwei aufgelegte Büschel: überlappende Teilpfade müssten sich auf
       Wickelrichtungen verlassen, und eine umgedrehte Richtung dreht
       stillschweigend Fläche in Loch. Mit `evenodd` und einer Kontur kann
       das nicht passieren.

       Augen und Schnabel sind echte Aussparungen. Sie sind der Negativraum,
       den V2 misst — bleibt er bei kleiner Rendergröße übrig, trägt die
       Zeichnung; läuft er zu, ist sie ein Klumpen. -->
  <path fill="#1F1056" fill-rule="evenodd"
        d="M 8.0 1.9
           C 9.6 1.9 10.9 2.2 11.9 2.7
           L 15.5 1.9
           C 14.2 3.0 13.4 4.0 13.0 5.2
           C 15.4 6.0 16.0 8.6 15.4 10.6
           C 14.4 13.4 11.4 14.6 8.0 14.6
           C 4.6 14.6 1.6 13.4 0.6 10.6
           C 0.0 8.6 0.6 6.0 3.0 5.2
           C 2.6 4.0 1.8 3.0 0.5 1.9
           L 4.1 2.7
           C 5.1 2.2 6.4 1.9 8.0 1.9 Z
           M 3.34 8.99 A 1.55 1.55 0 1 0 6.44 8.99
           A 1.55 1.55 0 1 0 3.34 8.99 Z
           M 9.56 8.99 A 1.55 1.55 0 1 0 12.66 8.99
           A 1.55 1.55 0 1 0 9.56 8.99 Z
           M 8.0 9.7 C 8.75 9.7 9.35 10.3 9.35 11.05
           C 9.35 12.1 8.7 13.3 8.0 14.3
           C 7.3 13.3 6.65 12.1 6.65 11.05
           C 6.65 10.3 7.25 9.7 8.0 9.7 Z"/>
  </g>
</svg>
