<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
  <!-- Grundfläche des App-Icons. Sie ist hell, weil die Marke dunkel ist:
       Bügel und Kopf sind beide tiefes Violett, also muss der Grund den
       Kontrast liefern. Eine dunkle Platte ließ den Kopf bei 1,23:1
       verschwinden — der Grund, warum die großen Stufen matschig wirkten. -->
  <g id="rp-plate">
    <defs>
      <linearGradient id="rp-plate-fill" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#5798BD"/>
        <stop offset="1" stop-color="#8570CB"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="128" height="128" rx="22" fill="url(#rp-plate-fill)"/>
  </g>
  <g id="rp-mark" transform="translate(23.9036 22.9639) scale(5.012048)">
  <!-- Stufe für 24 und 32 px, zugleich die Vorlage des Symbolic. Ein Pfad,
       keine Kopfhörer: bei dieser Größe wäre der Bügel eine 1-px-Linie, die
       am Kopf klebt.

       Die Silhouette ist dieselbe wie in `mark-reduced.svg` — Kopf und
       Büschel zu einer Kontur verschmolzen, umgerechnet aufs 16er Raster.
       Eine eigene Formensprache an dieser Stufe hieße: bei 32 px eine
       andere Eule als bei 48 px.

       Augen und Schnabel sind echte Aussparungen. Sie sind der Negativraum,
       den V2 misst — bleibt er bei kleiner Rendergröße übrig, trägt die
       Zeichnung; läuft er zu, ist sie ein Klumpen. -->
  <path fill="#1F1056" fill-rule="evenodd"
        d="M 0.60 0.90
           C 1.30 2.60 1.90 4.60 2.20 6.66
           C 0.90 7.60 0.22 8.90 0.22 10.31
           C 0.22 13.47 3.54 15.44 8 15.44
           C 12.46 15.44 15.78 13.47 15.78 10.31
           C 15.78 8.90 15.10 7.60 13.80 6.66
           C 14.10 4.60 14.70 2.60 15.40 0.90
           C 14.00 2.60 12.20 3.50 10.55 3.91
           C 9.75 3.55 8.90 3.34 8 3.34
           C 7.10 3.34 6.25 3.55 5.45 3.91
           C 3.80 3.50 2.00 2.60 0.60 0.90 Z
           M 3.43 10.05 A 1.55 1.55 0 1 0 6.53 10.05
           A 1.55 1.55 0 1 0 3.43 10.05 Z
           M 9.47 10.05 A 1.55 1.55 0 1 0 12.57 10.05
           A 1.55 1.55 0 1 0 9.47 10.05 Z
           M 8 11.70 L 8.85 13.15 L 8 14.70 L 7.15 13.15 Z"/>
  </g>
</svg>
