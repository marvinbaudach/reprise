<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
  <!-- Grundfläche des App-Icons. Sie ist hell, weil die Marke dunkel ist:
       Bügel und Kopf sind beide tiefes Violett, also muss der Grund den
       Kontrast liefern. Eine dunkle Platte ließ den Kopf bei 1,23:1
       verschwinden — der Grund, warum die großen Stufen matschig wirkten. -->
  <g id="rp-plate">
    <defs>
      <linearGradient id="rp-plate-fill" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#5798BD"/>
        <stop offset="1" stop-color="#8570CB"/>
      </linearGradient>
    </defs>
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#rp-plate-fill)"/>
  </g>
  <g id="rp-mark" transform="translate(-0.8638 -1.9396) scale(0.104235)">
  <!-- Stufe für 48 und 64 px sowie für Androids Vordergrundebene.
       Sie zeigt **nur den Kopf**. Gemessen: in der vollen Komposition
       nehmen Bügel und Muscheln zwei Drittel der Breite, der Kopf bleibt
       bei 48 px 19 px breit und jedes Auge 2 px — das ist Grieß. Ohne
       Kopfhörer trägt derselbe Kopf 36 px und die Augen lesen.

       Die Koordinaten sind absichtlich dieselben wie in `mark.svg`: die
       Zeichnung ist ein Ausschnitt, keine zweite Eule. Der leere Rand im
       viewBox stört nicht — jede Zielfläche richtet sich an der
       gezeichneten Fläche aus, nicht am Raster.

       Auch die Farbe ist vereinfacht: alle Verläufe liegen auf einem Wert.
       Das ist zugleich Bedingung für Android — VectorDrawable kennt keine
       Verlaufsverweise. -->

  <g id="rp-m-rp-g-tufts">
    <path d="M 228 264 C 372 358 486 404 596 430 C 486 470 400 512 336 566
             C 318 462 282 356 228 264 Z"
          fill="#2B155E"/>
    <path d="M 1018 264 C 874 358 760 404 650 430 C 760 470 846 512 910 566
             C 928 462 964 356 1018 264 Z"
          fill="#2B155E"/>
  </g>

  <path id="rp-m-rp-head" fill="#33195F"
        d="M 623 402 C 852 402 1008 550 1008 746
           C 1008 902 843 999 623 999 C 403 999 239 902 239 746
           C 239 550 394 402 623 402 Z"/>

  <path id="rp-m-rp-face" fill="#8A679C"
        d="M 623 777 L 316 596
           C 268 630 252 700 256 800
           C 262 900 420 952 623 952
           C 826 952 984 900 990 800
           C 994 700 978 630 930 596 Z"/>

  <g id="rp-m-rp-g-eyes">
    <path fill="#3E9FA4" d="M 441.5 670.1 A 74 70 0 1 0 548 733 Z"/>
    <path fill="#3E9FA4" d="M 698 733 A 74 70 0 1 0 804.5 670.1 Z"/>
    <circle cx="475" cy="728" r="37" fill="#160A43"/>
    <circle cx="771" cy="728" r="37" fill="#160A43"/>
  </g>

  <path id="rp-m-rp-beak" fill="#8E8CB2"
        d="M 623 773 C 651 773 674 796 674 824
           C 674 860 650 903 623 950
           C 596 903 572 860 572 824
           C 572 796 595 773 623 773 Z"/>
  </g>
</svg>
