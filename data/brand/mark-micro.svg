<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Stufe für 24 und 32 px, zugleich die Vorlage des Symbolic. Ein Pfad,
       keine Kopfhörer: bei dieser Größe wäre der Bügel eine 1-px-Linie, die
       am Kopf klebt.

       Die Silhouette ist dieselbe wie in `mark-reduced.svg` — Kopf und
       Büschel zu einer Kontur verschmolzen, umgerechnet aufs 16er Raster.
       Eine eigene Formensprache an dieser Stufe hieße: bei 32 px eine
       andere Eule als bei 48 px.

       Augen und Schnabel sind echte Aussparungen. Sie sind der Negativraum,
       den V2 misst — bleibt er bei kleiner Rendergröße übrig, trägt die
       Zeichnung; läuft er zu, ist sie ein Klumpen. -->
