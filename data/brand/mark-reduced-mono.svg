<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1247 1000" width="1247" height="1000"
     fill="currentColor">
  <!-- Silhouette der reduzierten Zeichnung. Sie trägt Androids Themed Icon,
       das vom System eingefärbt wird — dort zählt nur Alpha.

       Wichtig ist, dass diese Silhouette **dieselbe Form** hat wie der
       farbige Foreground-Layer: sonst zeigt derselbe Launcher je nach
       Einstellung zwei verschiedene Eulen. Das Gate misst die Deckung
       beider Formen gegeneinander (V8), deshalb steht sie im selben
       Raster und benutzt dieselben Koordinaten.

       Augen und Schnabel sind hier Aussparungen statt Flächen: einfarbig
       verschmelzen sie sonst mit dem Kopf zu einem Klumpen. -->
  <path id="rm-tuft-l" d="M 261 392 C 363 404 457 442 530 496
                          C 460 520 403 560 363 610 C 344 520 308 444 261 392 Z"/>
  <path id="rm-tuft-r" d="M 985 392 C 883 404 789 442 716 496
                          C 786 520 843 560 883 610 C 902 520 938 444 985 392 Z"/>
