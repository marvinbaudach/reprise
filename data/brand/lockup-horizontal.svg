<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1335.19 328.00" width="1335.19" height="328.00">
  <!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
  <g id="rp-lh-mark" transform="translate(-4.3333 -62.6667) scale(26.666667)">
  <!-- Die Marke. Eine einzige Zeichnung für jede Größe — kein Stufenbau
       mehr aus voll, reduziert und micro.

       Sie ist auf dem **16er Raster** gezeichnet, und jede tragende Kante
       liegt auf einer ganzen oder halben Rasterlinie. Damit sind 32, 48,
       64, 128 und 512 px glatte Vielfache: die Zeichnung wird vergrößert,
       nicht interpoliert.

       Flach gefüllt, ohne Verlauf. Die Tiefe kommt von der Platte darunter.
       Ein Verlauf in der Marke hätte zwei Kosten: Androids VectorDrawable
       kennt keine Verlaufsverweise, und bei 16 px ist ein Verlauf über drei
       Pixel ohnehin nur Matsch.

       Keine Kopfhörer. Gemessen war das nicht zu retten: in der vollen
       Komposition blieb der Kopf bei einem 48-px-Icon 19 px breit und jedes
       Auge 2 px.

       Die Augen sind das Eulensignal und tragen es doppelt — als Fläche in
       der Farbfassung und als Ring in `mark-mono.svg`. Ein Auge, das
       einfarbig nur ein Loch ist, liest als Katzenauge; erst die Pupille
       darin macht es zum Auge. -->
  <path id="rp-lh-rp-head" fill="#2B155E"
        d="M 8 4 C 9.6 4 11 4.2 12.2 4.6
           C 13.1 3.8 14.3 3.2 15.7 2.5
           C 14.8 4 14.3 5.1 14.1 6.3
           C 15 7.3 15.4 8.4 15.4 9.5
           C 15.4 12.4 12.4 14.5 8 14.5
           C 3.6 14.5 0.6 12.4 0.6 9.5
           C 0.6 8.4 1 7.3 1.9 6.3
           C 1.7 5.1 1.2 4 0.3 2.5
           C 1.7 3.2 2.9 3.8 3.8 4.6
           C 5 4.2 6.4 4 8 4 Z"/>
  <circle cx="5" cy="9" r="2" fill="#3E9FA4"/>
  <circle cx="11" cy="9" r="2" fill="#3E9FA4"/>
  <circle cx="5" cy="9" r="1" fill="#160A43"/>
  <circle cx="11" cy="9" r="1" fill="#160A43"/>
  <path id="rp-lh-rp-beak" fill="#A7B7CE" d="M 7 11 L 9 11 L 8 14.5 Z"/>
  </g>
  <style>
    @font-face {
      font-family: 'Fraunces';
      font-weight: 600;
      font-style: normal;
      src: url(data:font/ttf;base64,) format('truetype');
    }
  </style>
  <text x="490.8000" y="257.8000"
        font-family="Fraunces, 'Instrument Serif', Georgia, serif"
        font-size="268" font-weight="600" letter-spacing="2"
        fill="currentColor">Reprise</text>
</svg>
