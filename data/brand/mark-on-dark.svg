<!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1247 1000" width="1247" height="1000">
  <defs>
    <!-- Der Bügel ist dunkel und trägt nur einen schmalen Teal-Streifen.
         In der Vorlage dominiert der Kopf, der Bügel stützt ihn. Ein heller
         Bügel dreht diese Rangfolge um und macht aus der Eule ein Beiwerk. -->
    <linearGradient id="rp-od-rp-band" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7A56B0"/>
      <stop offset="1" stop-color="#9478CC"/>
    </linearGradient>
    <linearGradient id="rp-od-rp-sheen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E6E9E"/>
      <stop offset="1" stop-color="#5798BD"/>
    </linearGradient>
    <linearGradient id="rp-od-rp-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8262BC"/>
      <stop offset="1" stop-color="#8A67C0"/>
    </linearGradient>
    <!-- Die Gesichtsscheibe ist oben gesättigt und wird zum Kinn hin heller.
         Gemessen an der Vorlage bei x=500: #C09AD0 unter den Augen,
         #9880A6 am Kinn. Eine radiale Aufhellung zur Mitte hin, wie in der
         ersten Fassung, dreht diesen Verlauf um. -->
    <linearGradient id="rp-od-rp-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C09AD0"/>
      <stop offset="1" stop-color="#D8C6E2"/>
    </linearGradient>
    <!-- Die Iris läuft von Teal oben nach Gelbgrün unten. In der Vorlage
         ist das ein Verlauf, kein Ring: ein grüner Ring um eine teale Iris
         zerfällt bei kleiner Größe zu einem grünen Fleck. -->
    <linearGradient id="rp-od-rp-iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B4670"/>
      <stop offset="0.25" stop-color="#176A8D"/>
      <stop offset="0.62" stop-color="#82A99E"/>
      <stop offset="1" stop-color="#B0D098"/>
    </linearGradient>
    <linearGradient id="rp-od-rp-beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7B7CE"/>
      <stop offset="0.62" stop-color="#8E8CB2"/>
      <stop offset="1" stop-color="#2B3B69"/>
    </linearGradient>
  </defs>

  <!-- Bügel: Scheitel auf der Mittelachse y=0..145, Enden an den Muscheln. -->
  <g id="rp-od-rp-g-band">
    <path d="M 74 674 C 74 258 314 0 623 0 C 932 0 1173 258 1173 674
             L 1065 674 C 1065 326 872 145 623 145 C 374 145 182 326 182 674 Z"
          fill="url(#rp-od-rp-band)"/>
    <path d="M 112 612 C 140 258 356 44 623 44 C 890 44 1107 258 1135 612
             C 1080 300 880 96 623 96 C 366 96 167 300 112 612 Z"
          fill="url(#rp-od-rp-sheen)"/>
  </g>

  <!-- Ohrmuscheln: drei Formen je Seite. Die Vorlage staffelt fünf Ringe;
       ab 64 px laufen sie zu einem Streifenmuster zusammen, das nichts mehr
       zeigt. Ein Ring trägt die Teal-Farbe der Marke, der Rest ist Masse. -->
  <g id="rp-od-rp-g-cups">
    <ellipse cx="118" cy="674" rx="118" ry="190" fill="#7A56B0"/>
    <ellipse cx="1129" cy="674" rx="118" ry="190" fill="#7A56B0"/>
    <path fill="#5798BD" fill-rule="evenodd"
          d="M 118 522 A 84 152 0 1 1 117.9 522 Z M 118 552 A 58 122 0 1 0 118.1 552 Z"/>
    <path fill="#5798BD" fill-rule="evenodd"
          d="M 1129 522 A 84 152 0 1 1 1128.9 522 Z M 1129 552 A 58 122 0 1 0 1129.1 552 Z"/>
    <ellipse cx="118" cy="674" rx="60" ry="124" fill="#8262BC"/>
    <ellipse cx="1129" cy="674" rx="60" ry="124" fill="#8262BC"/>
  </g>

  <!-- Ohrbüschel: schlanke Klingen, Spitzen bei (168|350) und (1078|350).
       In der Vorlage sind es lange, nach hinten gefegte Federspitzen mit
       sichtbarem Freiraum darum. Als breite Keile gezeichnet — die erste
       Fassung — lesen sie als Fledermausflügel, und die Marke verliert ihr
       Eulen-Signal noch vor der Verkleinerung. -->
  <g id="rp-od-rp-g-tufts">
    <path d="M 228 264 C 372 358 486 404 596 430 C 486 470 400 512 336 566
             C 318 462 282 356 228 264 Z"
          fill="#8262BC"/>
    <path d="M 1018 264 C 874 358 760 404 650 430 C 760 470 846 512 910 566
             C 928 462 964 356 1018 264 Z"
          fill="#8262BC"/>
  </g>

  <!-- Kopf: Scheitel auf der Mittelachse bei y=402, Kinn bei y=999. Der
       Verlauf ist flach — die Unterkante ist der einzige Rand, der gegen
       das violette Ende der Platte antritt, und ein aufgehellter Kopf sackt
       dort unter 3:1. -->
  <path id="rp-od-rp-head" fill="url(#rp-od-rp-head)"
        d="M 623 402 C 852 402 1008 550 1008 746
           C 1008 902 843 999 623 999 C 403 999 239 902 239 746
           C 239 550 394 402 623 402 Z"/>

  <!-- Gesichtsscheibe. Ihre Oberkante ist die Braue: eine Gerade mit
       Steigung 0,589 von (316|596) zum Scheitel (623|777) und gespiegelt
       zurück. Genau diese Kante macht den wachen Blick der Vorlage — der
       dunkle Kopf darüber ist die Braue, es braucht keine eigene Form.
       Gemessen: die Kante schneidet das linke Auge bei (441|670) an und
       verlässt es bei (548|733). -->
  <path id="rp-od-rp-face" fill="url(#rp-od-rp-face)"
        d="M 623 777 L 316 596
           C 268 630 252 700 256 800
           C 262 900 420 952 623 952
           C 826 952 984 900 990 800
           C 994 700 978 630 930 596 Z"/>

  <!-- Augen: 148 × 139 in der Vorlage, Mitte auf y=733. Sie sind als
       gekappte Ellipsen gezeichnet — die Sehne liegt auf der Brauenkante.
       Die frühere Fassung legte eine dunkle Braue über runde Augen und
       drückte sie damit zu Schlitzen: bei 128 px las die Marke als Katze. -->
  <g id="rp-od-rp-g-eyes">
    <path fill="url(#rp-od-rp-iris)" d="M 441.5 670.1 A 74 70 0 1 0 548 733 Z"/>
    <path fill="url(#rp-od-rp-iris)" d="M 698 733 A 74 70 0 1 0 804.5 670.1 Z"/>
    <circle cx="475" cy="728" r="37" fill="#160A43"/>
    <circle cx="771" cy="728" r="37" fill="#160A43"/>
    <circle cx="452" cy="704" r="8" fill="#FFFFFF"/>
    <circle cx="794" cy="704" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Schnabel: runder Ansatz unter dem Scheitel der Braue, lange Spitze.
       Er wird zur Spitze hin dunkel — in der Vorlage der einzige Ort, an
       dem die Zeichnung ins Marineblau geht. -->
  <path id="rp-od-rp-beak" fill="url(#rp-od-rp-beak)"
        d="M 623 773 C 651 773 674 796 674 824
           C 674 860 650 903 623 950
           C 596 903 572 860 572 824
           C 572 796 595 773 623 773 Z"/>
</svg>
