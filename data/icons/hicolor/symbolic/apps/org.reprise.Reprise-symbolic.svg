<!-- Erzeugt von scripts/build-brand-assets.sh. Nicht von Hand ändern. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     fill="#222222">
  <!-- Einfarbige Fassung: GNOME-Symbolic und Androids Themed Icon. Beide
       werden zur Laufzeit umgefärbt, dort zählt nur Alpha.

       Sie ist formgleich mit `mark.svg` — dasselbe Zeichen, nur ohne
       Verlauf. Bei einem Zeichen aus vier getrennten Flächen gibt es nichts
       zu vereinfachen: was farbig trägt, trägt einfarbig genauso. -->
  <path fill-rule="evenodd"
        d="M 10 2 L 14 2 L 14 14 L 10 14 Z
           M 7 2 L 9 2 L 9 14 L 7 14 Z
           M 2 5.5 A 1.5 1.5 0 1 0 5 5.5 A 1.5 1.5 0 1 0 2 5.5 Z
           M 2 10.5 A 1.5 1.5 0 1 0 5 10.5 A 1.5 1.5 0 1 0 2 10.5 Z"/>
</svg>
